# Render Blueprint: ONE free web service that runs the API and the alert worker together.
# Dashboard > New > Blueprint > pick this repo. Fill in the env vars Render asks for.
#
# Free instances sleep after ~15 minutes without traffic (the next visit then waits 15-30s).
# .github/workflows/keep-alive.yml pings /api/ping every 10 minutes to keep it awake; a cron-job.org
# job on https://<your-service>.onrender.com/api/ping every 10 minutes is a good backup.
# If it does sleep, the app catches up on startup and sends any alert that came due meanwhile.
services:
  - type: web
    name: squadsync-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: RUN_WORKER_IN_API
        value: "true"
      # Creates the TEAM RARE accounts (admin@rare.com etc., password rare@123) on startup if they don't exist yet.
      - key: SEED_TEAM_RARE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: DISPLAY_TZ
        value: Asia/Kolkata
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # Any made-up password-like word; you reuse it once when you connect the Telegram webhook.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Optional: any random string. Lets cron-job.org trigger/preview the nightly Telegram summary:
      # https://<service>.onrender.com/api/cron/daily-summary?key=<CRON_SECRET>
      - key: CRON_SECRET
        generateValue: true
      # Web push to phones (Firebase console > Project settings > Service accounts > Generate new private key).
      # Paste project_id, client_email and the whole private_key value from that JSON file.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Optional: reads uploaded BGMI results screenshots automatically.
      # Free: a Google Gemini key from https://aistudio.google.com/apikey. Used first when set.
      - key: GEMINI_API_KEY
        sync: false
      # More free readers, used when Gemini is busy or out of free uses: console.groq.com/keys and openrouter.ai/keys.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Squad AI: more free providers (cloud.cerebras.ai), and any OpenAI-compatible one as JSON (see .env.example).
      - key: CEREBRAS_API_KEY
        sync: false
      - key: AI_EXTRA_PROVIDERS
        sync: false
      # Paid alternative (console.anthropic.com > API keys). Without either key the admin types the numbers in.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: WhatsApp Cloud API. Leave blank to use Telegram only.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
