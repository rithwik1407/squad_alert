# Render Blueprint: ONE free web service that runs the API and the alert worker together.
# Dashboard > New > Blueprint > pick this repo. Fill in the env vars Render asks for.
#
# Free instances sleep after ~15 minutes without traffic. To keep alerts on time, point a free
# pinger (e.g. cron-job.org) at https://<your-service>.onrender.com/api/health every 10 minutes.
# If it does sleep, the app catches up on startup and sends any alert that came due meanwhile.
services:
  - type: web
    name: squadsync-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: DISPLAY_TZ
        value: Asia/Kolkata
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # Any made-up password-like word; you reuse it once when you connect the Telegram webhook.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Optional: WhatsApp Cloud API. Leave blank to use Telegram only.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
