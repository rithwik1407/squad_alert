<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#07070a" />
    <meta name="description" content="SquadSync: pick your 4, and only they get pinged before the match." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/rare-favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
    <title>SquadSync</title>
    <link rel="preload" as="image" href="/icons/rare-logo.webp" type="image/webp" />
    <style>
      /* Boot intro: plain CSS so it plays while the app code downloads. Transform / opacity only, plus a glow filter on the crest.
         Timeline (s): .05 grid + glow, .1 crest slams in, .35 shockwaves, .55 ignite + rays, .8 glint, .75 name, 1.05 tag, 1.85 out. */
      #intro { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #07070a; overflow: hidden; cursor: pointer;
        animation: intro-out .4s cubic-bezier(.22,1,.36,1) 1.85s forwards; }
      #intro::before { content: ''; position: absolute; inset: 0; opacity: 0; animation: intro-fade .6s ease .05s forwards;
        background: radial-gradient(460px 360px at 50% 44%, rgba(255,120,20,.30), transparent 70%),
          linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 56px 56px,
          linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 56px 56px; }
      #intro::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(closest-side at 50% 50%, transparent 55%, rgba(0,0,0,.7)); }
      #intro .scan { position: absolute; left: 0; right: 0; top: 0; height: 140px; opacity: 0;
        background: linear-gradient(180deg, transparent, rgba(255,169,77,.14) 70%, rgba(255,169,77,.6) 98%, transparent);
        animation: intro-scan .9s cubic-bezier(.5,0,.3,1) .15s forwards; }
      #intro .box { position: relative; display: flex; flex-direction: column; align-items: center; }
      #intro .stage { position: relative; width: 188px; height: 188px; }
      #intro .rays { position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; margin: -230px 0 0 -230px; border-radius: 50%; opacity: 0;
        background: repeating-conic-gradient(from 0deg, rgba(255,150,40,.16) 0 6deg, transparent 6deg 22deg);
        -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 75%); mask: radial-gradient(closest-side, #000 20%, transparent 75%);
        animation: intro-rays-in .7s ease .5s forwards, intro-spin 14s linear .5s infinite; }
      #intro .halo { position: absolute; inset: -30%; border-radius: 50%; opacity: 0;
        background: radial-gradient(closest-side, rgba(255,138,31,.55), rgba(255,80,0,.18) 55%, transparent);
        animation: intro-halo 1.6s ease-in-out .45s infinite alternate; }
      #intro .crest { position: absolute; inset: 0; width: 188px; height: 188px; object-fit: contain; opacity: 0; transform: scale(2.2) translateY(-6px); filter: brightness(0);
        animation: intro-crest .55s cubic-bezier(.2,1.25,.35,1) .1s forwards, intro-ignite 1.1s ease .2s forwards, intro-float 2.4s ease-in-out .9s infinite alternate; }
      #intro .glint { position: absolute; inset: 0; overflow: hidden; opacity: 0; animation: intro-fade .01s linear .8s forwards;
        -webkit-mask: url(/icons/rare-logo.webp) center / contain no-repeat; mask: url(/icons/rare-logo.webp) center / contain no-repeat; }
      #intro .glint i { position: absolute; inset: -10% -70%; transform: translateX(-100%) skewX(-18deg);
        background: linear-gradient(90deg, transparent 38%, rgba(255,246,225,.95) 50%, transparent 62%); animation: intro-glint .7s cubic-bezier(.45,0,.2,1) .8s forwards; }
      #intro .ring { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%;
        border: 2px solid rgba(255,138,31,.8); opacity: 0; animation: intro-ring .8s cubic-bezier(.2,.7,.3,1) .35s forwards; }
      #intro .ring.r2 { border-color: rgba(255,170,70,.6); border-width: 1px; animation-delay: .5s; animation-duration: 1s; }
      #intro .embers { position: absolute; left: 50%; bottom: 10px; width: 0; height: 0; }
      #intro .embers b { position: absolute; bottom: 0; width: 4px; height: 4px; border-radius: 50%; background: #ffb060; opacity: 0;
        box-shadow: 0 0 6px 1px rgba(255,138,31,.9); animation: intro-ember 1.6s ease-out infinite; }
      #intro .embers b:nth-child(1) { left: -140px; animation-delay: .3s; }
      #intro .embers b:nth-child(2) { left: -95px; animation-delay: .75s; width: 3px; height: 3px; }
      #intro .embers b:nth-child(3) { left: -60px; animation-delay: .45s; }
      #intro .embers b:nth-child(4) { left: -22px; animation-delay: 1s; width: 5px; height: 5px; }
      #intro .embers b:nth-child(5) { left: 18px; animation-delay: .55s; width: 3px; height: 3px; }
      #intro .embers b:nth-child(6) { left: 52px; animation-delay: .9s; }
      #intro .embers b:nth-child(7) { left: 88px; animation-delay: .35s; width: 5px; height: 5px; }
      #intro .embers b:nth-child(8) { left: 130px; animation-delay: .65s; width: 3px; height: 3px; }
      #intro .name { margin-top: 20px; font: 700 34px/1 Rajdhani, system-ui, sans-serif; color: #fff; text-transform: uppercase; letter-spacing: .22em; display: flex; }
      #intro .name span { display: inline-block; opacity: 0; transform: translateY(16px) scale(.8); filter: blur(6px); animation: intro-letter .5s cubic-bezier(.2,1.3,.4,1) forwards; }
      #intro .name .sp { width: .4em; }
      #intro .name b { color: #ff8a1f; font-weight: 700; text-shadow: 0 0 18px rgba(255,138,31,.6); }
      #intro .tag { margin-top: 10px; font: 600 11px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .34em; color: #71717a;
        opacity: 0; animation: intro-fade .4s ease 1.05s forwards; }
      #intro .bar { margin-top: 16px; width: 160px; height: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
      #intro .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff5a00, #ff8a1f, #ffd29a); transform: scaleX(0); transform-origin: left;
        box-shadow: 0 0 10px rgba(255,138,31,.9); animation: intro-bar 1.4s cubic-bezier(.65,0,.35,1) .2s forwards; }
      @keyframes intro-fade { to { opacity: 1; } }
      @keyframes intro-crest { 0% { opacity: 0; transform: scale(2.2) translateY(-6px); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes intro-ignite { 0% { filter: brightness(0) drop-shadow(0 0 0 rgba(255,138,31,0)); } 35% { filter: brightness(.6) drop-shadow(0 0 4px rgba(255,138,31,.6)); }
        60% { filter: brightness(1.45) drop-shadow(0 0 26px rgba(255,120,20,1)); } 100% { filter: brightness(1) drop-shadow(0 0 14px rgba(255,120,20,.55)); } }
      @keyframes intro-float { to { transform: translateY(-5px); } }
      @keyframes intro-halo { 0% { opacity: .5; transform: scale(.9); } 100% { opacity: 1; transform: scale(1.08); } }
      @keyframes intro-rays-in { to { opacity: 1; } }
      @keyframes intro-spin { to { transform: rotate(360deg); } }
      @keyframes intro-glint { to { transform: translateX(100%) skewX(-18deg); } }
      @keyframes intro-ring { 0% { opacity: 1; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.4); } }
      @keyframes intro-ember { 0% { opacity: 0; transform: translate(0, 0) scale(1); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, -230px) scale(.3); } }
      @keyframes intro-letter { to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes intro-scan { 0% { opacity: 1; transform: translateY(-140px); } 100% { opacity: 0; transform: translateY(100vh); } }
      @keyframes intro-bar { to { transform: none; } }
      @keyframes intro-out { to { opacity: 0; transform: scale(1.06); visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #intro { display: none; } }
    </style>
    <script>
      // Player's accent colour (Settings), applied before first paint so there's no flash.
      try { var a = localStorage.getItem('squadsync-accent'); if (a && a !== 'ember') document.documentElement.setAttribute('data-accent', a); } catch (e) {}
      // Start waking the (free, sleeps-when-idle) API right away, while the app's code is still downloading.
      try { fetch('/api/ping', { cache: 'no-store' }).catch(function () {}); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="scan"></div>
      <div class="box">
        <div class="stage">
          <div class="embers"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
          <span class="rays"></span>
          <span class="halo"></span>
          <span class="ring"></span>
          <span class="ring r2"></span>
          <img class="crest" src="/icons/rare-logo.webp" alt="" width="188" height="188" />
          <span class="glint"><i></i></span>
        </div>
        <div class="name"><span style="animation-delay:.72s">T</span><span style="animation-delay:.76s">e</span><span style="animation-delay:.8s">a</span><span style="animation-delay:.84s">m</span><span class="sp"></span><b><span style="animation-delay:.92s">R</span><span style="animation-delay:.97s">a</span><span style="animation-delay:1.02s">r</span><span style="animation-delay:1.07s">e</span></b></div>
        <div class="tag">SQUADSYNC // BGMI</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script>
      // Intro plays once per browser session. Tap skips; reduced motion never shows it (see the CSS).
      (function () {
        var el = document.getElementById('intro');
        var seen = false;
        try { seen = sessionStorage.getItem('rare-intro') === '1'; sessionStorage.setItem('rare-intro', '1'); } catch (e) {}
        if (seen || location.pathname.indexOf('/join') === 0) { el.remove(); return; }
        var done = function () { if (el && el.parentNode) el.remove(); };
        el.addEventListener('click', done);
        setTimeout(done, 2300);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
